# Reusable PR-preview workflow (issue #52 / ADR-008 / ADR-009 / ADR-011).
#
# Hosted once, here. A new MSOCIETY-endorsed project's repo needs none of
# NEON_API_KEY / RAILWAY_API_TOKEN or any per-project identifier as its own
# secrets — all live server-side, once, in community-os's own API, along
# with the Neon/Railway project this project's maintainers linked via the
# infra-config admin UI. COMMUNITY_OS_CI_TOKEN is one org-level secret,
# inherited by every current and future repo — nothing to set up per repo
# for that part.
#
# This workflow just tells community-os's API to ensure/tear down a PR
# preview — the API does everything else itself: forking the Neon branch,
# and (when the project has a Railway project/service/source-environment
# linked) creating the Railway environment, pushing every variable, and
# triggering the deploy, all via its own Neon/Railway API credentials. No
# Railway dashboard step, no app-side self-configure step — see ADR-009.
#
# It deliberately does NOT run migrations against the forked branch (see
# ADR-011): the API only knows its own migration files, so it can't safely
# run some other project's migration tooling, and running arbitrary PR
# code server-side to do so would be a code-execution risk on trusted
# infra. Instead this exposes the branch's `database_url` as a job output,
# for the calling repo's own migration step to use — that step already has
# the PR's checkout and knows its own migration command. A caller repo
# that has migrations to run adds one more job:
#
#   name: Preview
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, closed]
#   jobs:
#     preview:
#       uses: msocietyhq/community-os/.github/workflows/preview.yml@main
#       secrets:
#         COMMUNITY_OS_CI_TOKEN: ${{ secrets.COMMUNITY_OS_CI_TOKEN }}
#     migrate:
#       needs: preview
#       if: success() && github.event.action != 'closed'
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - run: <your project's own migration command>
#           env:
#             DATABASE_URL: ${{ needs.preview.outputs.database_url }}
#
# `database_url` is scoped to just this one ephemeral, 30-day PR branch —
# a much narrower credential than the account-wide NEON_API_KEY /
# RAILWAY_API_TOKEN this design keeps out of every repo, and no more
# exposed than the same value already sitting in this PR's own Railway
# environment variables. A project with no schema of its own to migrate
# (or one that's fine with the clone-of-production schema a fork already
# has) can skip the `migrate` job entirely.
name: Preview Provisioning

on:
  workflow_call:
    inputs:
      api_url:
        description: "community-os API base URL"
        required: false
        type: string
        default: "https://api.msociety.dev"
    secrets:
      COMMUNITY_OS_CI_TOKEN:
        required: true
    outputs:
      database_url:
        description: "Connection string for this PR's Neon branch (empty on teardown runs)"
        value: ${{ jobs.ensure.outputs.database_url }}

jobs:
  ensure:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      database_url: ${{ steps.extract.outputs.database_url }}
    steps:
      # Split from the extraction step below on purpose: GitHub Actions
      # refuses to set a job/step output ("Skip output ... since it may
      # contain secret") from any step whose script references `secrets.*`
      # at all, regardless of the output value's actual content — it isn't
      # about the value being masked (removing an `::add-mask::` call here
      # didn't help; this step never had one and still tripped it). Writing
      # the response to a file, then reading it back in a step with no
      # `secrets.` reference of its own, avoids that block entirely.
      - name: Ensure PR preview environment
        run: |
          curl --fail-with-body -sS -X POST "${{ inputs.api_url }}/api/v1/dev-environments/ci/ensure" \
            -H "Content-Type: application/json" \
            -H "X-CI-Service-Token: ${{ secrets.COMMUNITY_OS_CI_TOKEN }}" \
            -d "$(jq -n \
                --arg repo "${{ github.repository }}" \
                --argjson pr ${{ github.event.pull_request.number }} \
                --arg author "${{ github.event.pull_request.user.login }}" \
                '{repoFullName: $repo, prNumber: $pr, prAuthorGithubLogin: $author}')" \
            -o /tmp/preview-ensure-response.json

      - name: Extract database_url
        id: extract
        run: |
          database_url="$(jq -r '.databaseUrl' /tmp/preview-ensure-response.json)"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"
          rm -f /tmp/preview-ensure-response.json

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Tear down PR preview environment
        run: |
          curl --fail-with-body -sS -X POST "${{ inputs.api_url }}/api/v1/dev-environments/ci/teardown" \
            -H "Content-Type: application/json" \
            -H "X-CI-Service-Token: ${{ secrets.COMMUNITY_OS_CI_TOKEN }}" \
            -d "$(jq -n \
                --arg repo "${{ github.repository }}" \
                --argjson pr ${{ github.event.pull_request.number }} \
                '{repoFullName: $repo, prNumber: $pr}')"
