name: Preview Database

# Gives each PR its own Neon database branch, copy-on-write from the parent
# branch, kept schema-current and torn down when the PR closes, and pushes
# its connection string into the matching Railway PR environment's
# DATABASE_URL — so PR previews get an isolated database instead of sharing
# (and risking corrupting) production's.
#
# Inert until NEON_API_KEY (secret) and NEON_PROJECT_ID (variable) are set —
# every job below no-ops (skips entirely) without them, so this file is safe
# to merge before that setup is done. `if:` conditions can't reference the
# `secrets` context directly (GitHub Actions rejects the whole workflow file
# at parse time if they do), so the check goes through a job-level `env:`
# var instead.
#
# The `neondatabase/create-branch-action` step has run for real against a
# live Neon project (branch created, migrations applied) — that part's
# confirmed working, not just written-from-docs.
#
# The "push to Railway" step assumes Railway's "PR Environments" feature is
# already turned on in the Railway project dashboard (a toggle + the Railway
# GitHub App installed on this repo — not something this file can do).
#
# It authenticates with RAILWAY_API_TOKEN (an account/workspace-level token),
# not RAILWAY_TOKEN (a project token) — project tokens are scoped to one
# *existing* environment (e.g. production or staging) at creation time, and
# can't reach a pr-<n> environment that doesn't exist yet when the token is
# made. Every `railway` flag used below is verified against `--help` on the
# actual installed CLI (v5.58.0) run locally — including a real bug from the
# first live run: `environment list` has no `--project` flag (unlike
# `variable set`, which does), so it needs `railway link` first. What's
# still unverified against a live project: the JSON shape of `environment
# list --json` (assumed to have a `.name` field), whether `railway link
# --project <id> --json` truly resolves non-interactively with no other
# disambiguating info, and whether a PR environment's name actually contains
# the PR number (used to pick the right one among possibly several
# `--ephemeral` environments). A genuine CLI error still aborts the job
# (set -e) rather than being hidden — only "ran fine, found no match" is the
# soft-skip path.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, dev]

jobs:
  create-or-update:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      NEON_CONFIGURED: ${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' }}
      RAILWAY_CONFIGURED: ${{ secrets.RAILWAY_API_TOKEN != '' && vars.RAILWAY_PROJECT_ID != '' && vars.RAILWAY_SERVICE != '' }}
    steps:
      - name: Skip — preview DB secrets not configured
        if: env.NEON_CONFIGURED != 'true'
        run: echo "NEON_API_KEY / NEON_PROJECT_ID not set — skipping preview DB branch."

      - name: Create or reset Neon branch for this PR
        if: env.NEON_CONFIGURED == 'true'
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/checkout@v4
        if: env.NEON_CONFIGURED == 'true'

      - uses: oven-sh/setup-bun@v2
        if: env.NEON_CONFIGURED == 'true'
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        if: env.NEON_CONFIGURED == 'true'
        run: bun install --frozen-lockfile

      - name: Apply migrations to the preview branch
        if: env.NEON_CONFIGURED == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: bun run db:migrate

      - name: Skip — Railway variables not configured
        if: env.NEON_CONFIGURED == 'true' && env.RAILWAY_CONFIGURED != 'true'
        run: echo "RAILWAY_API_TOKEN / RAILWAY_PROJECT_ID / RAILWAY_SERVICE not set — skipping DATABASE_URL handoff to Railway."

      # Finds this PR's Railway "PR Environment" (Railway calls these
      # "ephemeral" environments in the CLI — --ephemeral filters to just
      # those, so this can't accidentally match production/staging even if
      # one of them happened to contain the PR number). Fails soft on "no
      # match found"; a real CLI error still aborts the job (set -e) rather
      # than being swallowed, so a genuine break stays visible.
      - name: Push DATABASE_URL to the matching Railway PR environment
        if: env.NEON_CONFIGURED == 'true' && env.RAILWAY_CONFIGURED == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DB_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          set -euo pipefail
          # `environment list` has no --project flag of its own (unlike
          # `variable set`) — it reads the linked project instead, so link
          # it first.
          npx -y @railway/cli link --project "$RAILWAY_PROJECT_ID" --json

          ENV_NAME=$(npx -y @railway/cli environment list --ephemeral --json \
            | jq -r --arg pr "$PR_NUMBER" '[.[] | select(.name | contains($pr))][0].name // empty')

          if [ -z "$ENV_NAME" ]; then
            echo "No ephemeral (PR) Railway environment matching PR #$PR_NUMBER found — skipping. Either PR Environments isn't enabled yet, or its naming doesn't match this assumption (check manually)."
            exit 0
          fi

          echo "Setting DATABASE_URL on Railway environment: $ENV_NAME"
          npx -y @railway/cli variable set "DATABASE_URL=$DB_URL" \
            --service "$RAILWAY_SERVICE" \
            --environment "$ENV_NAME" \
            --project "$RAILWAY_PROJECT_ID" \
            --skip-deploys --json

  delete:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      NEON_CONFIGURED: ${{ secrets.NEON_API_KEY != '' && vars.NEON_PROJECT_ID != '' }}
    steps:
      - name: Skip — preview DB secrets not configured
        if: env.NEON_CONFIGURED != 'true'
        run: echo "NEON_API_KEY / NEON_PROJECT_ID not set — skipping preview DB cleanup."

      - name: Delete this PR's Neon branch
        if: env.NEON_CONFIGURED == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
