name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      # No DATABASE_URL or other secrets needed — the suite doesn't touch a
      # live DB (see apps/api/src/services/ai-pricing.test.ts for why: DB/env
      # -dependent logic is kept out of unit tests on purpose).
      - name: Test
        run: bun run test
