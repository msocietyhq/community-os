# community-os is itself an endorsed project, so it uses its own reusable
# workflow the same way any other project repo would (see preview.yml's
# header comment for the copy-pasteable version other repos use). Calling it
# by relative path — rather than `owner/repo/.github/workflows/...@ref` —
# picks up whatever's on this same commit, not a separately-tagged release.
#
# The `migrate` job is this repo's own version of the "caller runs its own
# migrations" step preview.yml's header comment describes (see ADR-011) —
# community-os is both the platform and, here, just another project being
# previewed, so it uses its own existing `db:migrate` script.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    uses: ./.github/workflows/preview.yml
    secrets:
      COMMUNITY_OS_CI_TOKEN: ${{ secrets.COMMUNITY_OS_CI_TOKEN }}

  migrate:
    needs: preview
    # A custom `if:` replaces the default implicit "needs succeeded" check,
    # not add to it — without `success()` here, this would still run (with
    # an empty DATABASE_URL) after `preview` itself failed.
    if: success() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run this PR's migrations against its preview branch
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ needs.preview.outputs.database_url }}
